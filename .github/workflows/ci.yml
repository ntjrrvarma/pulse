name: Pulse Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx scikit-learn pandas numpy torch
        
    - name: Run Pytest
      # This env block fixes the "ModuleNotFoundError: No module named 'src'" error
      env:
        PYTHONPATH: .
      run: python -m pytest tests/ -v